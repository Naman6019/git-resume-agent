[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-resume-agent"
version = "0.1.0"
description = "Autonomous Git-Driven Resume & Portfolio Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naman Manocha", email = "namanmanocha6019@gmail.com" }]
keywords = ["resume", "portfolio", "git", "ai-agents", "ollama", "multi-agent", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-docx>=1.1.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "openai>=1.30.0"
]

[project.urls]
Homepage = "https://github.com/Naman6019/git-resume-agent"
Repository = "https://github.com/Naman6019/git-resume-agent"
Issues = "https://github.com/Naman6019/git-resume-agent/issues"

[project.scripts]
git-resume = "git_resume.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_resume*"]
