[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-resume-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Resume and Portfolio Intelligence Engine"
readme = "README.md"
authors = [{ name = "Naman Manocha", email = "namanmanocha6019@gmail.com" }]
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-docx>=1.1.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
    "openai>=1.30.0"
]

[project.scripts]
git-resume = "git_resume.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_resume*"]
